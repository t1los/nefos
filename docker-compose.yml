version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: pms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pms_users
      MYSQL_USER: pms_user
      MYSQL_PASSWORD: pms_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-data/init.sql:/docker-entrypoint-initdb.d/init.sql

  user-service:
    build: ./user-service
    container_name: pms_user_service
    restart: on-failure
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=mysql_db
      - DB_USER=pms_user
      - DB_PASSWORD=pms_password
      - DB_NAME=pms_users
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mysql_db

  mongo_db:
    image: mongo:6.0
    container_name: pms_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./db-data/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  team-service:
    build: ./team-service
    container_name: pms_team_service
    restart: on-failure
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongo_db:27017/pms_teams
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo_db

  task-service:
    build: ./task-service
    container_name: pms_task_service
    restart: on-failure
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongo_db:27017/pms_tasks
      - JWT_SECRET=supersecretkey123
    depends_on:
      - mongo_db

  frontend:
    image: nginx:alpine
    container_name: pms_frontend
    restart: always
    ports:
      - "80:80"  
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - team-service
      - task-service

volumes:
  mysql_data:
  mongo_data: