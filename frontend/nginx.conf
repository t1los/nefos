events {}

http {
    include mime.types;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/auth {
            proxy_pass http://user-service:3001;
        }
        location /api/users {
            proxy_pass http://user-service:3001;
        }
        location /api/admin {
            proxy_pass http://user-service:3001;
        }

        location /api/teams {
            proxy_pass http://team-service:3002;
        }

        location /api/tasks {
            proxy_pass http://task-service:3003;
        }
    }
}